name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'portfolio-v2/**'
  workflow_dispatch: # allow manual runs from the Actions tab

# Allow one concurrent deploy; cancel in-progress runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push to gh-pages branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-v2/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-v2
        run: npm ci

      - name: Build
        working-directory: portfolio-v2
        run: npm run build

      # Copy CNAME into the build output so the custom domain is preserved
      - name: Copy CNAME
        run: cp CNAME portfolio-v2/dist/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio-v2/dist
          # Keeps the gh-pages branch clean (force-push each deploy)
          force_orphan: true
